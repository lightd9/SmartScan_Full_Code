# Run manually from Codemagic. No push triggers or public App Store submission.
# Account/signing setup: IOS_CLOUD_BUILDS.md
definitions:
  ios_environment: &ios_environment
    node: "24"
    xcode: "26.6"
    cocoapods: default
  consumer_vars: &consumer_vars
    BUNDLE_ID: com.smartscan.consumer
    IOS_MARKETING_VERSION: "1.1.1"
    VITE_API_BASE_URL: https://smartscan-backend-52s4.onrender.com
    VITE_CONTRACT_ADDRESS: "0xC4Dc9a66A669F88ac80eA6555796Fb576a388D96"
    VITE_CHAIN_ID: "11155111"
    VITE_CHAIN_NAME: Sepolia Testnet
    VITE_CHAIN_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
    VITE_BLOCK_EXPLORER_URL: https://sepolia.etherscan.io
  enterprise_vars: &enterprise_vars
    BUNDLE_ID: com.smartscan.enterprise
    IOS_MARKETING_VERSION: "1.1.0"
    VITE_DATA_MODE: live
    VITE_API_BASE_URL: https://smartscan-backend-52s4.onrender.com
    VITE_VERIFICATION_ORIGIN: https://smart-scan-ten.vercel.app
  simulator_script: &simulator_script
    name: Test, bundle and compile for the iOS simulator
    script: bash ../scripts/build-ios-codemagic.sh simulator
  testflight_script: &testflight_script
    name: Test, bundle, sign and export for TestFlight
    script: bash ../scripts/build-ios-codemagic.sh testflight
  internal_testflight: &internal_testflight
    app_store_connect:
      auth: integration
      # Upload for internal testing; assign the build to an internal group in
      # App Store Connect after processing and answering export compliance.
      submit_to_testflight: false
      submit_to_app_store: false

workflows:
  ios-consumer-simulator:
    name: Consumer - iOS simulator check (no Apple membership)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: smartscan-mobile-consumer
    environment:
      <<: *ios_environment
      vars: *consumer_vars
    scripts:
      - *simulator_script
    artifacts:
      - $CM_BUILD_DIR/smartscan-mobile-consumer/build/ios/*-simulator.zip
      - $CM_BUILD_DIR/smartscan-mobile-consumer/build/ios/*.log
      - $CM_BUILD_DIR/smartscan-mobile-consumer/ios/App/Podfile.lock

  ios-enterprise-simulator:
    name: Enterprise - iOS simulator check (no Apple membership)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: smartscan-mobile-enterprise
    environment:
      <<: *ios_environment
      vars: *enterprise_vars
    scripts:
      - *simulator_script
    artifacts:
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/build/ios/*-simulator.zip
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/build/ios/*.log
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/ios/App/Podfile.lock

  ios-consumer-testflight:
    name: Consumer - signed TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: smartscan-mobile-consumer
    integrations:
      app_store_connect: smartscan-apple
    environment:
      <<: *ios_environment
      groups:
        - smartscan_consumer_app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smartscan.consumer
      vars: *consumer_vars
    scripts:
      - *testflight_script
    artifacts:
      - $CM_BUILD_DIR/smartscan-mobile-consumer/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/smartscan-mobile-consumer/build/ios/xcarchive/**/*.dSYM
      - $CM_BUILD_DIR/smartscan-mobile-consumer/build/ios/*.log
      - $CM_BUILD_DIR/smartscan-mobile-consumer/ios/App/Podfile.lock
      - /tmp/xcodebuild_logs/*.log
    publishing: *internal_testflight

  ios-enterprise-testflight:
    name: Enterprise - signed TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: smartscan-mobile-enterprise
    integrations:
      app_store_connect: smartscan-apple
    environment:
      <<: *ios_environment
      groups:
        - smartscan_enterprise_app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smartscan.enterprise
      vars: *enterprise_vars
    scripts:
      - *testflight_script
    artifacts:
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/build/ios/xcarchive/**/*.dSYM
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/build/ios/*.log
      - $CM_BUILD_DIR/smartscan-mobile-enterprise/ios/App/Podfile.lock
      - /tmp/xcodebuild_logs/*.log
    publishing: *internal_testflight
