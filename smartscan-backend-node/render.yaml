services:
  - type: web
    name: smartscan-backend
    runtime: node
    plan: free
    rootDir: smartscan-backend-node
    buildCommand: npm ci
    startCommand: node postgres.js
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CHAIN_RPC_URL
        sync: false
      - key: CHAIN_ID
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CONTRACT_DEPLOYMENT_BLOCK
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WALLET_LINK_ORIGIN
        sync: false
      - key: UPLOAD_STORAGE_DRIVER
        value: s3
      - key: UPLOAD_S3_BUCKET
        sync: false
      - key: UPLOAD_S3_REGION
        sync: false
      - key: UPLOAD_S3_ENDPOINT
        sync: false
      - key: UPLOAD_S3_ACCESS_KEY_ID
        sync: false
      - key: UPLOAD_S3_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOAD_S3_FORCE_PATH_STYLE
        value: "false"
      - key: UPLOAD_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: REDIS_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
      - key: SCAN_RETENTION_DAYS
        sync: false
      - key: RECONCILE_CONFIRMATIONS
        value: "2"
      - key: RECONCILE_HASHLESS_TIMEOUT_MS
        value: "900000"
      - key: RECONCILE_SUBMITTED_TIMEOUT_MS
        value: "86400000"
      - key: RECONCILE_INTERVAL_MS
        value: "60000"
